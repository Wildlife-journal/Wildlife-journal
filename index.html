<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1EBE1">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wildlife Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Wildlife Journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a cream page inside a double gold frame, centred logo and title, a diamond divider, a photo grid, and a black bottom bar with the four actions. */
:root{
  --bg:#F1EBE1; --paper:#FAF7F2; --ink:#1F1C18; --muted:#6B6256; --gold:#A98C55; --line:#E2D8C6; --tint:#EFE7DA;
  --btn:#1F1C18; --on-btn:#FAF7F2; --scrim:rgba(31,28,24,.5); --danger:#9C3A2B;
  --sans:'Lato','Avenir Next','Segoe UI',sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --icon:url("icon-192.png");
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45;
  padding-block:12px 96px;
  padding-left:max(10px, env(safe-area-inset-left,0px));
  padding-right:max(10px, env(safe-area-inset-right,0px));
}
button,input{font:inherit; color:inherit; border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.label{font-family:var(--sans); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700}

/* framed page */
.app{
  position:relative; max-width:640px; margin:0 auto; background:var(--paper); border:1px solid var(--gold);
  padding:34px 24px 30px; display:flex; flex-direction:column; gap:22px;
}
.app::before{content:""; position:absolute; inset:6px; border:1px solid var(--gold); pointer-events:none}

/* header */
.top{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.logo{
  width:92px; height:92px; border-radius:50%; background:var(--icon) center/cover no-repeat, #FBF2E9;
  box-shadow:0 0 0 3px var(--paper), 0 0 0 4px var(--gold); margin:4px 0 6px;
}
h1{font-family:var(--sans); font-weight:700; font-size:14px; line-height:1.2; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin:0; text-wrap:balance}
.counts{font-family:var(--serif); font-style:normal; font-weight:400; color:var(--ink); margin:0; font-size:44px; line-height:1.1; font-variant-numeric:tabular-nums}
.subcounts{font-family:var(--serif); font-style:italic; color:var(--muted); margin:0; font-size:20px}
.divider{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:300px; color:var(--gold)}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--gold)}
.divider i{display:block; width:9px; height:9px; background:var(--gold); transform:rotate(45deg)}
.heading{font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); text-align:center; margin:0}
.section{display:flex; flex-direction:column; align-items:center; gap:12px}

/* notice */
.notice{border:1px solid var(--line); background:var(--tint); padding:12px 14px; font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16px}
.notice b{color:var(--ink); font-weight:600; font-style:normal}

/* tools */
.tools{display:flex; flex-direction:column; gap:12px}
.search{width:100%; border:1px solid var(--gold); background:var(--paper); padding:12px 14px; min-height:48px; font-size:16px}
.search::placeholder{color:var(--muted); font-family:var(--serif); font-style:italic}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.chip{flex:none; border:1px solid var(--ink); background:transparent; padding:8px 14px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; min-height:38px}
.chip[aria-pressed="true"]{background:var(--btn); border-color:var(--btn); color:var(--on-btn)}

/* buttons */
.btn{
  font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  border:1px solid var(--ink); background:transparent; color:var(--ink); padding:14px 18px; min-height:48px; text-align:center;
}
.btn.solid{background:var(--btn); color:var(--on-btn)}
.btn.quiet{border-color:var(--line); color:var(--muted)}
.btn.danger{border-color:var(--danger); color:var(--danger)}

/* grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 14px}
.card{background:none; border:0; padding:0; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.selectbar{width:100%; border:1px solid var(--gold); background:var(--paper); padding:12px 14px; min-height:48px; font:inherit; font-size:16px; color:inherit; border-radius:0}
.home{display:flex; flex-direction:column; gap:14px; margin-bottom:20px}
.stats{margin:0; text-align:center; color:var(--muted); font-family:var(--serif); font-style:italic}
.dayc{display:flex; gap:14px; align-items:center; width:100%; border:1px solid var(--gold); background:var(--paper); padding:10px; text-align:left; cursor:pointer}
.dayc .ph{width:84px; height:84px; aspect-ratio:auto; flex:none}
.dayc .grow{flex:1; min-width:0}
.vitem{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.vitem video{width:100%; max-height:60vh; background:#000}
.viewrow{display:flex; gap:8px}
.viewrow .selectbar{flex:1; min-width:0}
.viewrow .btn{flex:none; min-width:84px}
.ic{display:inline-flex; width:20px; height:20px; color:var(--gold); flex:none; align-items:center; justify-content:center}
.ic svg{width:100%; height:100%; fill:currentColor; stroke:currentColor}
.chip{display:inline-flex; align-items:center; gap:7px}
.chip .ic{width:16px; height:16px; color:var(--gold)}
.chip[aria-pressed="true"] .ic{color:#E7D3A3}
.row .thumb{width:56px; height:56px; flex:none}
.row .thumb .ph{aspect-ratio:auto; width:56px; height:56px; border-radius:50%}
.list.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 12px}
.card{display:flex; flex-direction:column; gap:6px; width:100%; border:0; background:none; text-align:left; padding:0; cursor:pointer}
.card .ph{aspect-ratio:4/5}
.card .cname{margin-top:2px}
.cardmeta{display:flex; align-items:center; gap:6px}
.cardmeta .ic{width:16px; height:16px}
.hero{position:relative; overflow:hidden}
.hero .ph{aspect-ratio:4/3}
.hero .heroin{position:absolute; left:0; right:0; bottom:0; padding:56px 16px 14px; background:linear-gradient(to top,rgba(31,28,24,.85),rgba(31,28,24,0)); color:#FAF7F2}
.hero .gtitle{color:#FAF7F2; margin:0}
.hero .sci{color:#E8DFCC}
.hero .herocat{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#E7D3A3; margin-bottom:6px}
.hero .herocat .ic{color:#E7D3A3; width:16px; height:16px}
.goal{display:flex; flex-direction:column; gap:8px}
.goalbar{height:8px; background:var(--line)}
.goalbar i{display:block; height:100%; background:var(--gold)}
.ph{
  position:relative; aspect-ratio:4/5; width:100%; max-width:100%; overflow:hidden;
  background:var(--icon) center/58% no-repeat, #FBF2E9; box-shadow:inset 0 0 0 1px var(--line);
}
.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.tag{position:absolute; left:8px; top:8px; background:var(--paper); color:var(--ink); padding:2px 9px}
.cname{font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; line-height:1.3; overflow-wrap:anywhere; margin-top:4px}
.sci{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16px; line-height:1.25; overflow-wrap:anywhere}
.meta{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; line-height:1.35}
.more{align-self:center}
.empty{color:var(--muted); padding:28px 0; text-align:center; font-family:var(--serif); font-style:italic}

/* species list */
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:14px; padding:14px 0; border:0; border-bottom:1px solid var(--line); width:100%; background:none; text-align:left}
.row .grow{flex:1; min-width:0}
.row .n{font-weight:700; font-size:22px; font-variant-numeric:tabular-nums; color:var(--gold)}

/* bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--btn); color:var(--on-btn);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
.navb{flex:1; min-width:0; background:none; border:0; border-bottom:3px solid transparent; color:inherit; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; padding:20px 4px 17px; opacity:.8}
.navb[aria-pressed="true"]{opacity:1; border-bottom-color:var(--gold)}

/* sheet */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:20}
.panel{
  background:var(--paper); border-top:2px solid var(--gold); width:100%; max-width:560px; max-height:92%; overflow-y:auto;
  padding-top:22px; padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(22px, env(safe-area-inset-left,0px)); padding-right:max(22px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:16px;
}
@media (min-width:640px){ .overlay{align-items:center} .panel{max-height:88%; border:1px solid var(--gold)} }
.panel .ph{aspect-ratio:4/3; background-size:34%}
.panel h2{font-family:var(--sans); font-size:18px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; line-height:1.3; margin:0; text-wrap:balance}
.panel .sci{font-size:18px}
.panel dl{margin:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:14px 0}
.panel dt{font-family:var(--serif); font-style:italic; font-size:18px; letter-spacing:0; text-transform:none; font-weight:400; color:var(--muted); text-align:right; padding-right:18px}
.panel dd{margin:0; min-width:0; overflow-wrap:anywhere; border-left:1px solid var(--gold); padding-left:18px}
.panel .btnrow{display:flex; gap:8px; flex-wrap:wrap}
.panel .btnrow .btn{flex:1 1 140px}
.panel a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; align-self:center; padding:0 6px}
.field{display:flex; flex-direction:column; gap:6px}
.field select{border:1px solid var(--gold); background:var(--paper); padding:11px 12px; min-height:48px; width:100%; font:inherit; color:inherit; border-radius:0}
.field input{border:1px solid var(--gold); background:var(--paper); padding:11px 12px; min-height:48px; width:100%}
.note{color:var(--muted); font-family:var(--serif); font-style:italic; margin:0}
input[type=file]{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
@media (prefers-reduced-motion:no-preference){ .card:hover .ph{filter:brightness(1.04)} }
/* detail sheet headings */
.sec{display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px}
.sec .gold{color:var(--gold); letter-spacing:.3em}
.sec .div{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:260px}
.sec .div::before,.sec .div::after{content:""; flex:1; height:1px; background:var(--gold)}
.sec .div i{display:block; width:8px; height:8px; background:var(--gold); transform:rotate(45deg)}
.pill{display:inline-block; border:1px solid var(--gold); padding:2px 10px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
/* species gallery */
.gal{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px}
.gitem{display:flex; flex-direction:column; gap:6px; min-width:0}
.gitem .ph{aspect-ratio:1/1}
.gact{display:flex; flex-direction:column; gap:6px}
.btn.sm{min-height:40px; padding:10px 12px}
.panel .list{margin:0}
/* zoom and crop */
.ph.zoomable{cursor:zoom-in}
.gitem .ph{aspect-ratio:4/5}
.panel > .ph{aspect-ratio:4/5; width:min(100%,320px); align-self:center; background-size:40%}
.gact{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.gact.stack{grid-template-columns:1fr}
.gact .btn{padding:10px 4px; letter-spacing:.1em}
.cropframe{position:relative; aspect-ratio:4/5; width:min(100%,320px); align-self:center; overflow:hidden; background:#FBF2E9; box-shadow:inset 0 0 0 1px var(--gold); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.cropframe.grab{cursor:grabbing}
.cropframe img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; display:block}
.field input[type=range]{padding:0; min-height:36px; border:0; background:none; accent-color:var(--gold)}
.lb{position:fixed; inset:0; z-index:30; background:rgba(8,7,6,.96); display:flex; flex-direction:column}
.lbscroll{flex:1; min-height:0; overflow:auto; display:flex; padding:12px; -webkit-overflow-scrolling:touch}
.lbscroll img{margin:auto; max-width:100%; max-height:100%; object-fit:contain; cursor:zoom-in; display:block}
.lb.zoomed .lbscroll img{max-width:none; max-height:none; width:260%; cursor:zoom-out}
.lbbar{display:flex; gap:8px; padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px))}
.lbbar .btn{flex:1; border-color:#F3EADF; color:#F3EADF}
.lbbar .btn.solid{background:#F3EADF; color:#1A1815}
/* index + species gallery page */
.back{display:inline-block; align-self:flex-start; color:var(--ink); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:5px; padding:12px 0; min-height:44px}
.gallery{display:flex; flex-direction:column; gap:16px}
.gallery .btnrow{display:flex; gap:8px; flex-wrap:wrap}
.gallery .btnrow .btn{flex:1 1 140px}
.gtitle{font-family:var(--sans); font-size:20px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; line-height:1.3; margin:0 0 4px; text-wrap:balance}
.row .chev{color:var(--gold); font-size:24px; line-height:1}
.row:hover .cname{text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px}
/* letters, counts, notes, viewer arrows */
.letter{list-style:none; font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:.3em; color:var(--gold); padding:20px 0 6px; border-bottom:1px solid var(--gold)}
.letter:first-child{padding-top:0}
.row .cnt{white-space:nowrap; font-size:12px; letter-spacing:.04em}
.row .cnt.none{opacity:.7; font-style:italic}
textarea.notes{width:100%; min-height:120px; border:1px solid var(--gold); background:var(--paper); padding:12px 14px; font-family:var(--serif); font-size:16px; line-height:1.5; resize:vertical; color:var(--ink); border-radius:0}
textarea.notes::placeholder{color:var(--muted); font-style:italic}
.lbcount{position:absolute; top:max(14px,env(safe-area-inset-top,0px)); left:0; right:0; text-align:center; color:#F3EADF; font-size:13px; letter-spacing:.16em; pointer-events:none; text-shadow:0 1px 3px #000}
.lbbar .btn.nav{flex:0 0 52px; padding-left:0; padding-right:0; font-size:22px; letter-spacing:0; line-height:1}
/* reference look: light, airy rows */
.list .row{padding:20px 0}
.list .cname{font-size:20px; font-weight:400; letter-spacing:0; text-transform:none; margin-top:0; line-height:1.25}
.list .sci{font-size:16px; margin-top:2px}
.row .cnt{background:var(--gold); color:#FAF7F2; border-radius:999px; padding:3px 11px; font-weight:700; font-size:12px; letter-spacing:.06em}
.row .cnt.none{background:none; color:var(--muted); font-weight:400; opacity:1; padding:0}
.letter{margin-top:6px}

/* iNaturalist name suggestions */
.acl{list-style:none; margin:0; padding:0; border:1px solid var(--gold); background:var(--paper); max-height:280px; overflow-y:auto}
.acl li{margin:0}
.acl button{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:8px 10px; min-height:56px}
.acl li:last-child button{border-bottom:0}
.acl img,.acl .nophoto{width:40px; height:40px; flex:none; object-fit:cover; background:var(--tint); display:block}
.acl .t{display:flex; flex-direction:column; min-width:0}
.acl .n{font-weight:700; font-size:14px; overflow-wrap:anywhere}
.acl .s{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:14px; overflow-wrap:anywhere}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="logo" role="img" aria-label="Toucan on a branch, the Wildlife Journal logo"></div>
    <h1>Wildlife Journal</h1>
    <p class="counts" id="counts"></p>
    <p class="subcounts" id="subcounts"></p>
    <div class="divider" aria-hidden="true"><i></i></div>
  </header>

  <div class="notice" id="notice" role="status" hidden></div>

  <div class="tools" id="tools">
    <input class="search" id="q" type="search" placeholder="Search a species or a place" aria-label="Search">
    <div class="chips" id="chips"></div>
    <div class="viewrow"><select class="selectbar" id="sort" aria-label="Sort the index"><option value="az">Sort: A to Z</option><option value="recent">Sort: most recent</option><option value="pics">Sort: most pictures</option></select><button class="btn" id="vw" type="button">Grid</button></div>
  </div>

  <main id="view"></main>
</div>

<nav class="bar" aria-label="Main">
  <button class="navb" id="tab-index" type="button" aria-pressed="true">Index</button>
  <button class="navb" id="add" type="button">Add</button>
  <button class="navb" id="import" type="button">Data</button>
</nav>
<input type="file" id="csv" accept=".csv,text/csv" aria-label="iNaturalist CSV file">

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Picture">
  <div class="lbcount" id="lbcount" aria-live="polite"></div>
  <div class="lbscroll" id="lbscroll"><img id="lbimg" alt=""></div>
  <div class="lbbar">
    <button class="btn nav" id="lbprev" type="button" aria-label="Previous picture" hidden>&#8249;</button>
    <button class="btn" id="lbzoom" type="button">Zoom</button>
    <button class="btn" id="lbcrop" type="button">Crop</button>
    <button class="btn nav" id="lbnext" type="button" aria-label="Next picture" hidden>&#8250;</button>
    <button class="btn solid" id="lbclose" type="button">Close</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Sighting"></div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var TAXA={Aves:'Birds',Mammalia:'Mammals',Reptilia:'Reptiles',Amphibia:'Amphibians',Insecta:'Insects',Arachnida:'Arachnids',Plantae:'Plants',Fungi:'Fungi',Mollusca:'Molluscs',Actinopterygii:'Fish',Animalia:'Other animals',Chromista:'Chromista',Protozoa:'Protozoa'};
  var CATS=[['Aves','Bird'],['Mammalia','Mammal'],['Reptilia','Reptile'],['Amphibia','Amphibian'],['Insecta','Insect'],['Arachnida','Arachnid'],['Actinopterygii','Fish'],['Plantae','Plant'],['Fungi','Fungus'],['Mollusca','Mollusc'],['Animalia','Other']];
  function catSelect(id,value,onchange){
    var sel=h('select',{id:id});
    sel.appendChild(h('option',{value:''},'Choose a category'));
    CATS.forEach(function(c){ var op=h('option',{value:c[0]},c[1]); if(c[0]===value) op.selected=true; sel.appendChild(op); });
    if(onchange) sel.addEventListener('change',function(){ onchange(sel.value); });
    return sel;
  }
  /* English names (iNaturalist gave some in Spanish or local languages) */
  var EN={
    'Pteroglossus frantzii':'Fiery-billed Aracari','Penelope purpurascens':'Crested Guan','Trogon caligatus':'Gartered Trogon',
    'Trogon massena':'Slaty-tailed Trogon','Rupornis magnirostris':'Roadside Hawk','Setophaga pensylvanica':'Chestnut-sided Warbler',
    'Odocoileus virginianus':'White-tailed Deer','Ctenosaura similis':'Black Spiny-tailed Iguana','Corallus ruschenbergerii':'Central American Tree Boa',
    'Tropidacris cristata':'Giant Red-winged Grasshopper','Dryas iulia moderata':'Julia Heliconian','Centroleninae':'Glass Frogs',
    'Centruroides bicolor':'Bark Scorpion','Apiomerus vexillarius':'Bee Assassin Bug','Discomorpha conspersipennis':'Tortoise Beetle',
    'Sericopelma':'Tarantula','Zammara smaragdula':'Cicada'
  };
  function eng(sci,common){ return EN[sci]||common; }
  function fixName(o){ if(o.sci&&EN[o.sci]) o.common=EN[o.sci]; return o; }
  var SAMPLE=[

  /* share a picture with the phone's share menu */
  function sharePicture(o,name,btn){
    var label=btn.textContent; btn.disabled=true; btn.textContent='...';
    function done(msg){ btn.disabled=false; btn.textContent=msg||label; if(msg) setTimeout(function(){ btn.textContent=label; },2500); }
    function download(blob){
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name.replace(/[^\w\- ]+/g,'')+'.jpg';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000); done('Saved');
    }
    srcOf(o).then(function(src){
      if(!src){ done('No picture'); return; }
      var getBlob=/^data:/.test(src)?fetch(src).then(function(r){return r.blob()}):fetch(src,{mode:'cors'}).then(function(r){ if(!r.ok) throw 0; return r.blob(); });
      getBlob.then(function(blob){
        var ext=(blob.type.split('/')[1]||'jpeg').replace('jpeg','jpg');
        var file=new File([blob],name.replace(/[^\w\- ]+/g,'')+'.'+ext,{type:blob.type||'image/jpeg'});
        if(navigator.canShare && navigator.canShare({files:[file]})){

        } else download(blob);

  function loadForCrop(o){

        if(/\/medium\./.test(src)) tries.push({url:src.replace('/medium.','/large.'),cors:true});
        tries.push({url:src,cors:true});
        tries.push({url:src,cors:false});

      return new Promise(function(res){
        (function next(i){
          if(i>=tries.length) return res(null);
          var im=new Image(); if(tries[i].cors) im.crossOrigin='anonymous';
          im.onload=function(){ res({img:im,clean:tries[i].cors||/^data:/.test(tries[i].url)}); };

  function cropPicture(t,back){
    var p=$('#panel'); p.textContent='';
    var c0=getCrop(t), z=c0?c0.z:1, px=c0?c0.px:0, py=c0?c0.py:0, loaded=null;

    frame.appendChild(im);
    var slider=h('input',{id:'crop-z',type:'range',min:'1',max:'4',step:'0.02',value:String(z),'aria-label':'Zoom'});
    var msg=h('p',{class:'note'},'Drag the picture to move it. Use the slider to zoom in. Save crop keeps only this part of the picture.');
    function limit(){ var m=(z-1)/2; px=Math.max(-m,Math.min(m,px)); py=Math.max(-m,Math.min(m,py)); }
    function apply(){ limit(); im.style.transform=cropCss({z:z,px:px,py:py}); }

    frame.addEventListener('pointerdown',function(e){ drag={x:e.clientX,y:e.clientY}; try{frame.setPointerCapture(e.pointerId)}catch(_){} frame.classList.add('grab'); });

      var W=frame.clientWidth, H=frame.clientHeight, img=loaded.img, w=img.naturalWidth, h2=img.naturalHeight;
      var s0=Math.max(W/w,H/h2), vw=W/(s0*z), vh=H/(s0*z);
      var cx=w/2-(px*W)/(s0*z), cy=h2/2-(py*H)/(s0*z);
      var sx=Math.max(0,Math.min(w-vw,cx-vw/2)), sy=Math.max(0,Math.min(h2-vh,cy-vh/2));

        savebtn.textContent='Back'; savebtn.onclick=function(){ back(); };
      });
    }
    var savebtn=h('button',{class:'btn solid',type:'button',on:{click:save}},'Save crop');
    p.appendChild(h('h2',null,'Crop picture'));
    p.appendChild(msg);
    p.appendChild(frame);
    p.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'crop-z'},'Zoom'),slider));
    p.appendChild(h('div',{class:'btnrow'},

  /* iNaturalist CSV import */
  function parseCSV(t){
    if(t.charCodeAt(0)===0xFEFF) t=t.slice(1);
    var rows=[],row=[],f='',q=false;
    for(var i=0;i<t.length;i++){
      var c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){row.push(f);f=''}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f);f='';rows.push(row);row=[] }
      else f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row)}
    return rows;
  }
  function importText(text){
    var rows=parseCSV(text);
    if(rows.length<2) throw new Error('empty');
    var ix={}; rows[0].forEach(function(n,i){ix[n.trim().toLowerCase()]=i});
    if(ix.scientific_name===undefined && ix.common_name===undefined) throw new Error('columns');
    function g(r,k){return ix[k]!==undefined?(r[ix[k]]||'').trim():''}
    var incoming=[], withImg=0;
    rows.slice(1).forEach(function(r){
      if(r.length<2) return;
      var sci=g(r,'scientific_name'), common=g(r,'common_name');
      if(!sci&&!common) return;
      var id=g(r,'id'), image=safeUrl(g(r,'image_url')), url=safeUrl(g(r,'url'));
      if(!url && /^\d+$/.test(id)) url='https://www.inaturalist.org/observations/'+id;
      if(image) withImg++;
      incoming.push({id:'inat-'+(id||incoming.length),date:g(r,'observed_on')||g(r,'time_observed_at').slice(0,10),place:g(r,'place_guess').replace(/^[A-Z0-9]{4,8}\+[A-Z0-9]{2,3},\s*/,''),
        lat:g(r,'latitude'),lon:g(r,'longitude'),sci:sci,common:eng(sci,common||sci),taxon:g(r,'iconic_taxon_name'),image:image,url:url});
    });
    if(!incoming.length) throw new Error('rows');
    var old={}; obs.forEach(function(o){ if(!o.sample) old[o.id]=o });
    incoming.forEach(function(o){ var e=old[o.id]; if(e){ if(e.hasPhoto) o.hasPhoto=true; if(e.noPic) o.noPic=true; if(e.crop) o.crop=e.crop; } old[o.id]=o });
    obs=Object.keys(old).map(function(k){return old[k]});
    isSample=false;
    return {n:incoming.length,img:withImg};
  }

  function makeBackup(){
    var ids=obs.filter(function(o){return o.hasPhoto}).map(function(o){return o.id}).concat(extras.map(function(x){return x.id}));
    var photos={};
    return Promise.all(ids.map(function(id){ return getPhoto(id).then(function(d){ if(d) photos[id]=d; }); })).then(function(){
      var data={app:'wildlife-journal',version:2,date:today(),obs:obs,extras:extras,covers:covers,names:names,notes:notes,favs:favs,photos:photos};
      var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
      var name='wildlife-journal-backup-'+today()+'.json';
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)},60000);
      return put('lastBackup',today()).then(function(){ return name; });
    });
  }
  function pickBackup(status){
    var inp=h('input',{type:'file',accept:'.json,application/json','aria-label':'Choose a backup file'});
    document.body.appendChild(inp);
    inp.addEventListener('change',function(){
      var f=inp.files&&inp.files[0]; document.body.removeChild(inp); if(!f) return;
      var r=new FileReader();
      r.onload=function(){
        var d=null; try{ d=JSON.parse(String(r.result)); }catch(e){}
        if(!d||d.app!=='wildlife-journal'||!Array.isArray(d.obs)){ status.textContent='This is not a Wildlife Journal backup file.'; return; }
        confirmRestore(d);

  }

      obs=d.obs.map(fixName); extras=d.extras||[]; covers=d.covers||{}; names=d.names||{}; notes=d.notes||{}; favs=d.favs||{}; isSample=false;

  /* ---------- sync between phones (Firebase Realtime Database, plain web requests) ---------- */
  var SYNC_DB='https://marilyn-s-recipe-default-rtdb.firebaseio.com';
  var SYNC_KINDS=['names','notes','covers','extras','obsx','favs'];
  var sync={key:'',snap:{},pv:{},dirty:{},busy:null,again:false,timer:null,last:'',err:'',suppress:false,photoMsg:''};
  var DATAIDS={}; DATA.forEach(function(o){DATAIDS[o.id]=1});
  function kOf(s){ return encodeURIComponent(s).replace(/\./g,'%2E'); }
  function unk(s){ try{return decodeURIComponent(s)}catch(e){return s} }
  function sUrl(p){ return SYNC_DB+'/wildlife/'+encodeURIComponent(kOf(sync.key))+'/'+p+'.json'; }
  function sameMap(a,b){ var ka=Object.keys(a),kb=Object.keys(b); if(ka.length!==kb.length) return false; return ka.every(function(k){return a[k]===b[k]}); }
  function saveDirty(){ put('syncDirty',sync.dirty); }

  /* a random sync key: 16 characters, about 79 bits, no look-alike letters */
  function makeKey(){
    var abc='abcdefghjkmnpqrstuvwxyz23456789', s='';
    while(s.length<16){
      var a=new Uint8Array(32); crypto.getRandomValues(a);
      for(var i=0;i<a.length&&s.length<16;i++) if(a[i]<248) s+=abc.charAt(a[i]%31);
    }
    return s;
  }

  /* what this phone holds, as one text value per record */
  function localMaps(){
    var m={names:{},notes:{},covers:{},extras:{},obsx:{},favs:{}};
    Object.keys(favs).forEach(function(k){ m.favs[kOf(k)]='1'; });
    Object.keys(names).forEach(function(k){ m.names[kOf(k)]=JSON.stringify(names[k]); });
    Object.keys(notes).forEach(function(k){ m.notes[kOf(k)]=JSON.stringify(notes[k]); });
    Object.keys(covers).forEach(function(k){ m.covers[kOf(k)]=JSON.stringify(covers[k]); });
    extras.forEach(function(x){ m.extras[kOf(x.id)]=JSON.stringify(x); });
    var present={};
    obs.forEach(function(o){
      if(o.sample) return; present[o.id]=1;
      if(DATAIDS[o.id]){
        var p={}; if(o.noPic) p.noPic=1; if(o.hasPhoto) p.hasPhoto=1; if(o.crop) p.crop=o.crop;
        if(Object.keys(p).length) m.obsx[kOf(o.id)]=JSON.stringify(p);
      } else {
        var c={}; Object.keys(o).forEach(function(f){ if(f!=='sample') c[f]=o[f]; });
        m.obsx[kOf(o.id)]=JSON.stringify(c);
      }
    });
    Object.keys(DATAIDS).forEach(function(id){ if(!present[id]) m.obsx[kOf(id)]=JSON.stringify({deleted:1}); });
    return m;
  }
  /* three-way merge of one kind: remote R, local L, and what both agreed on last time S */
  function merge3(R,L,S,ops,kind){
    var out={}, ids={};
    [R,L,S].forEach(function(m){ Object.keys(m).forEach(function(k){ids[k]=1}); });
    Object.keys(ids).forEach(function(k){
      var r=R[k], l=L[k], s=S[k], res;
      if(l===s) res=r;
      else if(r===s){ res=l; ops.push({kind:kind,k:k,v:l}); }
      else if(r===l) res=r;
      else if(r===undefined){ res=l; ops.push({kind:kind,k:k,v:l}); }
      else res=r;
      if(res!==undefined) out[k]=res;
    });
    return out;
  }
  /* put the merged records into this phone (objects are updated in place so open screens stay valid) */
  function applyMaps(M,L){
    function plain(kind){
      var cur={}; Object.keys(M[kind]).forEach(function(k){ try{ cur[unk(k)]=JSON.parse(M[kind][k]); }catch(e){} }); return cur;
    }
    if(!sameMap(M.names,L.names)) names=plain('names');
    if(!sameMap(M.notes,L.notes)) notes=plain('notes');
    if(!sameMap(M.covers,L.covers)) covers=plain('covers');
    if(!sameMap(M.favs,L.favs)) favs=plain('favs');
    if(!sameMap(M.extras,L.extras)){
      var ex={}; extras.forEach(function(x){ex[x.id]=x});
      var nx=[];
      Object.keys(M.extras).forEach(function(k){ try{
        var rec=JSON.parse(M.extras[k]), e=ex[rec.id];
        if(e){ Object.keys(e).forEach(function(f){delete e[f]}); Object.assign(e,rec); nx.push(e); } else nx.push(rec);
      }catch(e2){} });
      extras=nx;
    }
    if(!sameMap(M.obsx,L.obsx)){
      var patches={}, fulls=[];
      Object.keys(M.obsx).forEach(function(k){ try{
        var rec=JSON.parse(M.obsx[k]), id=unk(k);
        if(DATAIDS[id]) patches[id]=rec; else fulls.push(rec);
      }catch(e){} });
      var by={}; obs.forEach(function(o){by[o.id]=o});
      var next=[];
      DATA.forEach(function(d){
        var p=patches[d.id]; if(p&&p.deleted) return;
        var o=by[d.id]; if(!o) o=fixName(JSON.parse(JSON.stringify(d)));
        delete o.noPic; delete o.hasPhoto; delete o.crop;
        if(p){ if(p.noPic) o.noPic=true; if(p.hasPhoto) o.hasPhoto=true; if(p.crop) o.crop=p.crop; }
        next.push(o);
      });
      fulls.forEach(function(rec){
        var o=by[rec.id];
        if(o){ Object.keys(o).forEach(function(f){delete o[f]}); Object.assign(o,rec); } else o=rec;
        next.push(fixName(o));
      });
      obs=next;
    }
  }
  function persistAll(){ return Promise.all([put('obs',obs),put('extras',extras),put('covers',covers),put('names',names),put('notes',notes),put('favs',favs)]); }

  function syncText(){
    if(!sync.key) return 'Sync is off. Choose a key, and type the same key on your other phones.';
    if(sync.err) return 'Not synced: '+sync.err;
    var s=sync.last?'Synced at '+sync.last+'.':'Syncing...';
    return s+(sync.photoMsg?' '+sync.photoMsg:'');
  }
  function syncStatus(){ var el=document.getElementById('sync-status'); if(el) el.textContent=syncText(); }
  function nowText(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  async function uploadPhoto(id,data,rpv){
    var pv=Date.now(), k=encodeURIComponent(kOf(id));
    var r1=await fetch(sUrl('photos/'+k),{method:'PUT',body:JSON.stringify(data)});
    if(!r1.ok) throw new Error('picture upload '+r1.status);
    var r2=await fetch(sUrl('photov/'+k),{method:'PUT',body:String(pv)});
    if(!r2.ok) throw new Error('picture upload '+r2.status);
    sync.pv[id]=pv; delete sync.dirty[id]; rpv[kOf(id)]=pv;
  }
  async function downloadPhoto(id,rp){
    var r=await fetch(sUrl('photos/'+encodeURIComponent(kOf(id))));
    if(!r.ok) throw new Error('picture download '+r.status);
    var data=await r.json(); if(!data) return false;
    sync.suppress=true; put('photo:'+id,data); sync.suppress=false;
    photoCache[id]=data; sync.pv[id]=rp; delete sync.dirty[id];
    return true;
  }
  async function syncPhotos(rpv){
    var ids={}; obs.forEach(function(o){ if(o.hasPhoto) ids[o.id]=1; }); extras.forEach(function(x){ ids[x.id]=1; });
    var list=Object.keys(ids), got=false, up=0, down=0;
    for(var i=0;i<list.length;i++){
      var id=list[i], local=await getPhoto(id), rp=rpv[kOf(id)], lp=sync.pv[id];
      if(local && (sync.dirty[id] || rp===undefined)){ sync.photoMsg='Sending pictures ('+(++up)+')...'; syncStatus(); await uploadPhoto(id,local,rpv); }
      else if((!local && rp!==undefined) || (local && rp!==undefined && lp!==rp)){
        sync.photoMsg='Getting pictures ('+(++down)+')...'; syncStatus();
        if(await downloadPhoto(id,rp)) got=true;
      }
    }
    sync.photoMsg='';
    await Promise.all([put('syncPv',sync.pv),put('syncDirty',sync.dirty)]);
    if(got) render();
  }

  async function syncRun(){
    var res=await Promise.all([fetch(sUrl('data')),fetch(sUrl('photov'))]);
    if(res[0].status===401||res[0].status===403) throw new Error('the database rules do not allow it');
    if(!res[0].ok||!res[1].ok) throw new Error('server answered '+res[0].status);
    var rd=(await res[0].json())||{}, rpv=(await res[1].json())||{};
    var L=localMaps(), M={}, ops=[], S=sync.snap||{};
    SYNC_KINDS.forEach(function(kind){ M[kind]=merge3(rd[kind]||{},L[kind],S[kind]||{},ops,kind); });
    var changed=SYNC_KINDS.some(function(kind){ return !sameMap(M[kind],L[kind]); });
    if(changed){ applyMaps(M,L); }
    if(ops.length){
      var body={}; ops.forEach(function(op){ body[op.kind+'/'+op.k]=op.v===undefined?null:op.v; });
      var pr=await fetch(sUrl('data'),{method:'PATCH',body:JSON.stringify(body)});
      if(pr.status===401||pr.status===403) throw new Error('the database rules do not allow it');
      if(!pr.ok) throw new Error('could not save, server answered '+pr.status);
    }
    sync.snap=M; await put('syncSnap',M);
    if(changed){ await persistAll(); render(); }
    await syncPhotos(rpv);
  }
  function syncNow(){
    if(!sync.key||!ready) return Promise.resolve();
    if(sync.busy){ sync.again=true; return sync.busy; }
    sync.busy=syncRun().then(function(){ sync.err=''; sync.last=nowText(); })
      .catch(function(e){ sync.err=(e&&e.message)||'no connection'; if(!navigator.onLine) sync.err='no connection'; })
      .then(function(){ sync.busy=null; syncStatus(); if(sync.again){ sync.again=false; syncSoon(); } });
    syncStatus();

				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {

					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );

		this.modules = new Array(this.moduleCount);

			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {

		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);

		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}

	getBestMaskPattern : function() {

		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;

		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);

		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}

	setupTypeNumber : function(test) {

		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}

	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}

		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};
